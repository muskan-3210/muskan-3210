<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" role="img" aria-label="Liquid Glass animated website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#ff9b2f"/><stop offset="1" stop-color="#ff3fcf"/></linearGradient>
    <linearGradient id="shell" x1="0.2" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".14" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="rl" cx=".18" cy="1.25" r=".65"><stop offset="0" stop-color="#ff9b2f" stop-opacity=".9"/><stop offset="1" stop-color="#ff9b2f" stop-opacity="0"/></radialGradient>
    <radialGradient id="rr" cx=".82" cy="1.25" r=".65"><stop offset="0" stop-color="#ff3fcf" stop-opacity=".9"/><stop offset="1" stop-color="#ff3fcf" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2a7e"/><stop offset=".55" stop-color="#5a1650"/><stop offset="1" stop-color="#3b0f3a"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rimL" x1="0" x2="1"><stop offset="0" stop-color="#ff9b2f" stop-opacity=".95"/><stop offset=".5" stop-color="#ff9b2f" stop-opacity="0"/></linearGradient>
    <linearGradient id="rimR" x1="1" x2="0"><stop offset="0" stop-color="#ff3fcf" stop-opacity=".95"/><stop offset=".5" stop-color="#ff3fcf" stop-opacity="0"/></linearGradient>
    <linearGradient id="botL" x1="0" x2="1"><stop offset="0" stop-color="#ff9b2f" stop-opacity=".9"/><stop offset="1" stop-color="#ff3fcf" stop-opacity=".9"/></linearGradient>
    <filter id="blur30" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur40" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur3" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="txtsh" x="-10%" y="-50%" width="120%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="shellClip"><rect x="44" y="24" width="612" height="156" rx="78"/></clipPath>
    <clipPath id="coreClip"><rect x="62" y="42" width="576" height="120" rx="60"/></clipPath>
  </defs>

  <!-- soft contact shadow -->
  <ellipse cx="340" cy="204" rx="270" ry="18" fill="#1e2230" opacity=".32" filter="url(#blur40)"/>
  <!-- colored floor glow -->
  <rect x="80" y="130" width="560" height="70" rx="35" fill="url(#glow)" opacity=".85" filter="url(#blur30)"/>

  <!-- outer clear glass shell -->
  <rect x="44" y="24" width="612" height="156" rx="78" fill="url(#shell)"/>
  <g clip-path="url(#shellClip)">
    <rect x="44" y="24" width="612" height="156" fill="url(#rl)"/>
    <rect x="44" y="24" width="612" height="156" fill="url(#rr)"/>
    <!-- bottom colored inner glow -->
    <rect x="80" y="160" width="540" height="26" rx="13" fill="url(#botL)" opacity=".8" filter="url(#blur3)"/>
  </g>
  <rect x="44.5" y="24.5" width="611" height="155" rx="77.5" fill="none" stroke="#141828" stroke-opacity=".22"/>
  <rect x="46" y="26" width="608" height="152" rx="76" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  <rect x="48" y="28" width="604" height="148" rx="74" fill="none" stroke="url(#rimL)" stroke-width="2.5"/>
  <rect x="48" y="28" width="604" height="148" rx="74" fill="none" stroke="url(#rimR)" stroke-width="2.5"/>

  <!-- inner tinted body -->
  <rect x="62" y="42" width="576" height="120" rx="60" fill="url(#core)"/>
  <g clip-path="url(#coreClip)">
    <ellipse cx="190" cy="170" rx="240" ry="62" fill="#ff9b2f" opacity=".85" filter="url(#blur30)"/>
    <ellipse cx="520" cy="172" rx="240" ry="60" fill="#ff3fcf" opacity=".85" filter="url(#blur30)"/>
    <rect x="62" y="130" width="576" height="32" fill="url(#botL)" opacity=".55" filter="url(#blur3)"/>
    <!-- curved gloss -->
    <rect x="80" y="46" width="540" height="58" rx="29" fill="url(#gloss)"/>
    <!-- glint -->
    <rect x="118" y="52" width="126" height="8" rx="4" fill="#fff" opacity=".7" filter="url(#blur3)"/>
  </g>
  <rect x="62.5" y="42.5" width="575" height="119" rx="59.5" fill="none" stroke="#fff" stroke-opacity=".3"/>

  <!-- label -->
  <text x="350" y="116" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="0" fill="#fff" filter="url(#txtsh)">LIQUID GLASS WEBSITE</text>
</svg>
