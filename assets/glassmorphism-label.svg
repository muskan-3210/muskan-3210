<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120" role="img" aria-label="Glassmorphism animated website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c9ff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#5b6cff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c9ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#bcd0ff" stop-opacity=".25"/>
      <stop offset=".75" stop-color="#c4b5fd" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="under" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="clip"><rect x="14" y="10" width="412" height="76" rx="26"/></clipPath>
  </defs>

  <!-- colored glow under the button -->
  <rect x="48" y="62" width="344" height="40" rx="20" fill="url(#glow)" opacity=".75" filter="url(#under)"/>

  <!-- frosted body -->
  <rect x="14" y="10" width="412" height="76" rx="26" fill="#1b2050" opacity=".55"/>
  <g clip-path="url(#clip)">
    <rect x="14" y="10" width="412" height="76" fill="url(#tint)"/>
    <ellipse cx="85" cy="82" rx="95" ry="30" fill="#35c9ff" opacity=".55" filter="url(#soft)"/>
    <ellipse cx="355" cy="82" rx="95" ry="30" fill="#8b5cf6" opacity=".6" filter="url(#soft)"/>
    <rect x="14" y="10" width="412" height="76" fill="url(#fill)"/>
    <rect x="14" y="10" width="412" height="32" fill="url(#sheen)"/>
  </g>

  <!-- borders -->
  <rect x="14.75" y="10.75" width="410.5" height="74.5" rx="25.5" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M42 12 H398" stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>

  <!-- label -->
  <text x="220" y="55" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="3.2" fill="#fff" fill-opacity=".95">GLASSMORPHISM WEBSITE</text>
</svg>
